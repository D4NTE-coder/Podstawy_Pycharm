<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Spotify Dashboard</h1>
    </header>

    <div class="dashboard-layout">

        <!-- LEFT SIDE -->
        <section class="top-tracks-section">
            <h2>Your Top Tracks</h2>

            {% if top_tracks %}
                <div class="tracks-grid">
                    {% for track in top_tracks %}
                        <div class="track-card">
                            <img src="{{ track['album']['images'][0]['url'] }}" class="album-cover">

                            <div class="track-info">
                                <h3>{{ track['name'] }}</h3>
                                <p>{{ track['artists'][0]['name'] }}</p>
                                <p>Popularity: {{ track['popularity'] }}</p>

                                <a href="{{ track['external_urls']['spotify'] }}" target="_blank" class="spotify-btn">
                                    Open in Spotify
                                </a>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        </section>

        <!-- RIGHT SIDE -->
        <section class="now-playing-section">
            <h2>Now Playing</h2>

            <div id="now-playing-container">
                <p>Loading current track...</p>
            </div>

            <div class="player-controls">

                <div class="control-buttons">
                    <button id="prev-btn">⏮</button>
                    <button id="play-btn">▶</button>
                    <button id="pause-btn">⏸</button>
                    <button id="next-btn">⏭</button>
                </div>

                <div class="progress-wrapper">
                    <span id="current-time">0:00</span>

                    <input type="range" id="progress-bar" min="0" max="100" value="0">

                    <span id="duration">0:00</span>

                </div>
                    <div class="recently-played-section">
    <h3>Recently Played</h3>
    <div id="recently-played-container"></div>
</div>
            </div>
        </section>

    </div>
</div>

<script>

function formatTime(ms) {
    const seconds = Math.floor(ms / 1000);
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    return `${min}:${sec < 10 ? "0" : ""}${sec}`;
}

function updateProgress(data) {
    if (!data) return;

    const progressPercent = (data.progress_ms / data.duration_ms) * 100;

    document.getElementById("progress-bar").value = progressPercent;
    document.getElementById("current-time").innerText = formatTime(data.progress_ms);
    document.getElementById("duration").innerText = formatTime(data.duration_ms);
}

function fetchCurrentlyPlaying() {
    fetch("/currently_playing")
        .then(res => res.json())
        .then(data => {

            const container = document.getElementById("now-playing-container");

            if (data.error) {
                container.innerHTML = `<p>${data.error}</p>`;
                return;
            }

            container.innerHTML = `
                <div class="now-playing-card">
                    <img src="${data.image}" class="now-playing-cover">

                    <div class="now-playing-info">
                        <h3>${data.name}</h3>
                        <p>${data.artist}</p>
                        <p><strong>Album:</strong> ${data.album}</p>
                    </div>
                </div>
            `;

            updateProgress(data);
        });
}

fetchCurrentlyPlaying();
setInterval(fetchCurrentlyPlaying, 1000);
fetchRecentlyPlayed();
setInterval(fetchRecentlyPlayed, 1000);

// BUTTONY
document.getElementById("play-btn").onclick = () => {
    fetch("/play", { method: "POST" });
};

document.getElementById("pause-btn").onclick = () => {
    fetch("/pause", { method: "POST" });
};

document.getElementById("next-btn").onclick = () => {
    fetch("/next", { method: "POST" });
};

document.getElementById("prev-btn").onclick = () => {
    fetch("/previous", { method: "POST" });
};


function fetchRecentlyPlayed() {
    fetch("/recently_played")
        .then(res => res.json())
        .then(data => {

            const container = document.getElementById("recently-played-container");

            if (!data || data.error) {
                container.innerHTML = "<p>No data</p>";
                return;
            }

            container.innerHTML = data.map(track => `
                <div class="recent-track">
                    <img src="${track.image}" class="recent-cover">
                    <div>
                        <p><strong>${track.name}</strong></p>
                        <p>${track.artist}</p>
                    </div>
                </div>
            `).join("");
        });
}

    let currentDuration = 0;

function updateProgress(data) {
    if (!data) return;

    currentDuration = data.duration_ms;

    const progressPercent =
        (data.progress_ms / data.duration_ms) * 100;

    document.getElementById("progress-bar").value = progressPercent;

    document.getElementById("current-time").innerText =
        formatTime(data.progress_ms);

    document.getElementById("duration").innerText =
        formatTime(data.duration_ms);
}

    document.getElementById("progress-bar").addEventListener("change", (e) => {
    const percent = e.target.value;

    const newPosition = (percent / 100) * currentDuration;

    fetch("/seek", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(Math.floor(newPosition))
    });
});
</script>

</body>
</html>
